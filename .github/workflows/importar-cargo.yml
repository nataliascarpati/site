name: Importar fotos do Cargo

# Rodar uma vez, antes de cancelar o Cargo: Actions > Importar fotos do Cargo > Run workflow
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar ferramentas
        run: |
          pip install pillow
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Baixar fotos e vídeos
        run: python3 ferramentas/importar_do_cargo.py
      - name: Salvar no repositório
        run: |
          git config user.name "importador"
          git config user.email "importador@users.noreply.github.com"
          git add -A img video conteudo
          git commit -m "Importa fotos e vídeos do Cargo" || echo "Nada novo"
          git push
      - name: Publicar de novo
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publicar.yml --ref main || true
